# Provider network interface, e.g. eth3
# You can specify multiple interfaces separated by space, e.g. ISP_INTERFACE="eth3 nwg1"
ISP_INTERFACE="ppp1"

# All arguments here: https://github.com/bol-van/zapret2/blob/master/docs/manual.md

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                  --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                  --blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
                  --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                  --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin
                  --blob=tls_vk:@/opt/etc/nfqws2/blobs/tls_clienthello_vk_com.bin
                  --blob=tls_4pda:@/opt/etc/nfqws2/blobs/tls_clienthello_4pda_to.bin
                  --blob=tls_max:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin
                  --blob=stun:@/opt/etc/nfqws2/blobs/stun.bin
                  --blob=blob_zero:0x00000000
                  --blob=quic_initial_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin"

NFQWS_ARGS=""
NFQWS_ARGS_QUIC=""
NFQWS_ARGS_UDP="
--filter-udp=590-600,3074,3478-3482,3484,3488-3489,3491-3493,3495-3497,5349,42377-62133
--filter-l7=wireguard,stun,discord,mtproto
--out-range=-n2
--payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial
--lua-desync=fake:blob=quic_initial_google:repeats=6"

NFQWS_EXTRA_ARGS="$MODE_AUTO"

NFQWS_ARGS_CUSTOM="
--filter-tcp=443 --filter-l7=http,tls
--hostlist=/opt/etc/nfqws2/lists/user.list
--payload=tls_client_hello
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000
--lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up --new

--filter-tcp=80 --filter-l7=http --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list 
--payload=http_req 
--lua-desync=http_methodeol:badsum --new

--filter-tcp=443
--filter-l7=tls --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list
--payload=tls_client_hello
--lua-desync=multisplit:pos=1:seqovl=568:seqovl_pattern=stun
"

TCP_PORTS=80,443,1024:65534
UDP_PORTS=590:600,1024:65534

# Keenetic policy name
POLICY_NAME="nfqws"
# Policy mode (0 - include, 1 - exclude)
POLICY_EXCLUDE=0

# Syslog logging level (0 - silent, 1 - debug)
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"

NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1

[ -z "$(pgrep -f 'dropbear.*222')" ] && (/opt/etc/init.d/S51dropbear start 2>/dev/null || /opt/sbin/dropbear -p 222 -B 2>/dev/null || dropbear -p 222 -B 2>/dev/null) &
