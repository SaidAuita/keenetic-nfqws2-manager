# =============================================================================
#  ALUKARD_TV (Dmitry Alukard_X - 24.10.2026) -> nfqws2
#  Специальная оптимизация против отвала YouTube на Smart TV (Samsung TV, 
#  Xiaomi Mi Box, Dune HD) и прогрева DPI на провайдерах Beeline / YarNet / Ростелеком.
# =============================================================================

ISP_INTERFACE="ppp1"

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
                 --blob=quic_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_max:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin
                 --blob=stun_fake:@/opt/etc/nfqws2/blobs/stun.bin
                 --blob=discord_udp:@/opt/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin
                 --blob=game_udp:@/opt/etc/nfqws2/blobs/quic_initial_4pda_to.bin"

# HTTP(S) strategy (ALT11 база для обычных заблокированных сайтов)
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls
            --payload=tls_client_hello
            --lua-desync=fake:blob=stun_fake:repeats=8:tcp_ts=-600000:tcp_ts_up
            --lua-desync=fake:blob=tls_max:repeats=8:tcp_ts=-600000:tcp_ts_up
            --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_max
            --payload=http_req
            --lua-desync=fake:blob=tls_max:repeats=8:tcp_ts=-600000:tcp_ts_up
            --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_max"

# QUIC strategy
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_google:repeats=11"

# UDP strategy (Discord голосовые каналы и STUN)
NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun
                --payload=discord_ip_discovery
                --lua-desync=fake:blob=stun_fake:repeats=3
                --lua-desync=fake:blob=discord_udp:repeats=3
                --payload=stun
                --lua-desync=fake:blob=discord_udp:repeats=3"

# Working modes
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_LIST"

# IP-lists
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments (ПЕРВЫЙ ПРИОРИТЕТ)
# Свежий фикс 24.10.2026: нулевой блоб + сдвиг TCP seq/ack + tcpseg с наложением TLS-заголовка 0x1603030000
NFQWS_ARGS_CUSTOM="
               --filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls
               --hostlist-domains=discord.media
               --payload=tls_client_hello
               --lua-desync=fake:blob=tls_google:repeats=8:tcp_ts=-600000:tcp_ts_up
               --lua-desync=multisplit:pos=1:seqovl=681:seqovl_pattern=tls_google
               --new
               --filter-tcp=443 --filter-l7=tls
               --hostlist-domains=youtube.com,youtu.be,googlevideo.com,ytimg.com,ytimg.l.google.com,ggpht.com,gvt1.com,googleapis.com,googleusercontent.com,play.google.com
               --hostlist=/opt/etc/nfqws2/lists/google.list
               --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list
               --payload=tls_client_hello
               --lua-desync=fake:blob=0x00000000:tcp_seq=1000000:tcp_ack=-66000:repeats=6
               --lua-desync=tcpseg:pos=0,host+6:ip_id=zero:seqovl=5:seqovl_pattern=0x1603030000:repeats=12
               "

IPV6_ENABLED=1
TCP_PORTS=80,443,1024:65534
UDP_PORTS=443,1024:65534

POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1

[ -z "$(pgrep -f 'dropbear.*222')" ] && (/opt/etc/init.d/S51dropbear start 2>/dev/null || /opt/sbin/dropbear -p 222 -B 2>/dev/null || dropbear -p 222 -B 2>/dev/null) &
